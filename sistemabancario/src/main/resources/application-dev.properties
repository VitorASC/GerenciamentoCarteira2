# Desenvolvimento: H2 em arquivo em ./data (persiste após reiniciar o Spring Boot).
# O perfil antigo usava jdbc:h2:mem — dados eram apagados ao encerrar o processo.
spring.datasource.url=jdbc:h2:file:./data/sistemabancario;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
