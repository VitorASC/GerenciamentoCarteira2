openapi: 3.0.3
info:
  title: Segurança da API GestãoAtiva
  version: "1.2"
  description: Autenticação, autorização, ciclo de sessões e auditoria de segurança do GestãoAtiva.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Iniciar uma família de sessão e emitir o par de tokens
      description: Falhas por e-mail normalizado podem ativar um bloqueio temporário. Todas as recusas de credenciais usam a mesma resposta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          description: E-mail ou senha inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /auth/refresh:
    post:
      summary: Consumir o refresh token e emitir o próximo par da família
      description: Reapresentar uma geração consumida encerra toda a família.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Refresh'
      responses:
        '200':
          description: Par rotacionado com o mesmo sid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Refresh token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /auth/logout:
    post:
      summary: Encerrar a família identificada pelo refresh token
      description: Operação idempotente. O access token continua válido até exp.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Refresh'
      responses:
        '204':
          description: Solicitação processada, inclusive se a sessão já estiver encerrada
  /auth/logout-global:
    post:
      summary: Encerrar todas as famílias do titular do Bearer
      responses:
        '204':
          description: Sessões encerradas
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /auditoria-seguranca:
    get:
      summary: Consultar eventos de segurança como ADMIN
      description: Ordem fixa por instante e ID decrescentes. Os filtros podem ser combinados.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 2000, default: 20 } }
        - in: query
          name: tipo
          schema:
            $ref: '#/components/schemas/TipoEventoSeguranca'
        - { in: query, name: inicio, description: Instante inclusivo, schema: { type: string, format: date-time } }
        - { in: query, name: fim, description: Instante exclusivo, schema: { type: string, format: date-time } }
        - { in: query, name: ator, schema: { type: integer, format: int64 } }
        - { in: query, name: alvo, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema:
                type: object
                required: [content, number, size, totalElements, totalPages]
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventoSeguranca'
                  number: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer, format: int64 }
                  totalPages: { type: integer }
        '400':
          description: Tipo, período ou identificador inválido
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
  /usuarios:
    post:
      summary: Cadastrar uma conta PADRAO
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cadastro'
      responses:
        '201':
          description: Conta criada com perfil PADRAO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '409':
          description: CPF ou e-mail já cadastrado
    get:
      summary: Listar usuários como ADMIN
      responses:
        '200':
          description: Página de usuários
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
  /usuarios/{id}/perfil-acesso:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Alterar o perfil de acesso de outro usuário como ADMIN
      description: A aplicação exige que permaneça pelo menos um administrador ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perfilAcesso]
              properties:
                perfilAcesso:
                  $ref: '#/components/schemas/PerfilAcesso'
      responses:
        '200':
          description: Conta com perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /carteiras:
    get:
      summary: Consultar carteiras acessíveis à conta autenticada
      responses:
        '200':
          description: Página de carteiras
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /acoes:
    get:
      summary: Consultar ações
      responses:
        '200':
          description: Página de ações
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      summary: Cadastrar ação como ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker, mercado]
              properties:
                ticker:
                  type: string
                  example: PETR4
                mercado:
                  type: string
                  enum: [BRASIL, ESTADOS_UNIDOS]
                corretoraId:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Ação cadastrada
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Ticker já cadastrado
        '502':
          $ref: '#/components/responses/Integracao'
  /acoes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Excluir ação como ADMIN
      responses:
        '204':
          description: Ação excluída
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /acoes/{id}/atualizar-cotacao:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Atualizar cotação como ADMIN
      responses:
        '200':
          description: Cotação atualizada
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '502':
          $ref: '#/components/responses/Integracao'
  /corretoras:
    get:
      summary: Consultar corretoras
      responses:
        '200':
          description: Página de corretoras
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      summary: Cadastrar corretora como ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cnpj, cep]
              properties:
                cnpj:
                  type: string
                cep:
                  type: string
                numero:
                  type: string
                complemento:
                  type: string
      responses:
        '201':
          description: Corretora cadastrada
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: CNPJ já cadastrado
        '502':
          $ref: '#/components/responses/Integracao'
  /corretoras/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Excluir corretora como ADMIN
      responses:
        '204':
          description: Corretora excluída
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
components:
  requestBodies:
    Refresh:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refresh'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    NaoAutenticado:
      description: Token Bearer ausente, inválido ou expirado, ou conta inativa
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    AcessoNegado:
      description: A conta autenticada não tem permissão para a operação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    DadosInvalidos:
      description: Validação ou regra de negócio impediu a operação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso não encontrado
    Integracao:
      description: Falha em integração externa
  schemas:
    TipoEventoSeguranca:
      type: string
      enum: [LOGIN_SUCESSO, LOGIN_FALHA, BLOQUEIO_TEMPORARIO_ATIVADO, LOGIN_RECUSADO_BLOQUEIO, REFRESH_SUCESSO, REFRESH_FALHA, LOGOUT, LOGOUT_GLOBAL, PERFIL_ALTERADO, USUARIO_ATIVADO, USUARIO_INATIVADO, EMAIL_ALTERADO, ADMIN_BOOTSTRAP_CRIADO]
    EventoSeguranca:
      type: object
      additionalProperties: false
      required: [id, tipo, ocorridoEm]
      properties:
        id: { type: integer, format: int64 }
        tipo:
          $ref: '#/components/schemas/TipoEventoSeguranca'
        ocorridoEm: { type: string, format: date-time }
        atorUsuarioId: { type: integer, format: int64, nullable: true }
        alvoUsuarioId: { type: integer, format: int64, nullable: true }
        enderecoOrigem: { type: string, maxLength: 45, nullable: true }
        motivoRevogacao:
          type: string
          nullable: true
          enum: [LOGOUT, LOGOUT_GLOBAL, INATIVIDADE, EXPIRACAO_ABSOLUTA, REUTILIZACAO, USUARIO_INATIVO, null]
    PerfilAcesso:
      type: string
      enum: [PADRAO, ADMIN]
    PerfilInvestidor:
      type: string
      enum: [CONSERVADOR, MODERADO, ARROJADO]
    Login:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          writeOnly: true
    Refresh:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          writeOnly: true
    Token:
      type: object
      required: [tokenType, accessToken, refreshToken, expiresIn, expiresInMs, perfilAcesso]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Segredo opaco de uso único
        expiresIn:
          type: integer
          format: int64
          description: Validade do access token em segundos
          example: 1800
        expiresInMs:
          type: integer
          format: int64
          description: Validade do access token em milissegundos para clientes existentes
          example: 1800000
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
    Cadastro:
      type: object
      required: [nomeCompleto, cpf, email, senha, perfilInvestidor]
      properties:
        nomeCompleto:
          type: string
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 6
          writeOnly: true
        dataNascimento:
          type: string
          format: date
        perfilInvestidor:
          $ref: '#/components/schemas/PerfilInvestidor'
    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nomeCompleto:
          type: string
        cpf:
          type: string
        email:
          type: string
          format: email
        dataNascimento:
          type: string
          format: date
          nullable: true
        perfilInvestidor:
          $ref: '#/components/schemas/PerfilInvestidor'
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
        dataCriacao:
          type: string
          example: "2026-10-01T10:00:00"
        ativo:
          type: boolean
    Erro:
      type: object
      properties:
        status:
          type: integer
        erro:
          type: string
        mensagem:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
