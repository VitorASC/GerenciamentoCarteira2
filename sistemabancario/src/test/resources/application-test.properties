spring.datasource.url=jdbc:h2:mem:test_sistemabancario;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.h2.console.enabled=false

# JWT exclusivo da suíte de testes.
app.security.jwt.secret=test-jwt-secret-at-least-32-characters-long-for-hs256!!
app.security.jwt.issuer=gestaoativa-teste
app.admin.bootstrap.enabled=false
