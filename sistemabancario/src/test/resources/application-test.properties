spring.datasource.url=jdbc:h2:mem:test_sistemabancario;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.h2.console.enabled=false

# JWT exclusivo da suíte de testes.
app.security.jwt.secret=${random.uuid}${random.uuid}
app.security.jwt.issuer=gestaoativa-teste
app.admin.bootstrap.enabled=false

# Os clientes isolados usam MockWebServer. O contexto Spring usa apenas destinos locais.
integration.brasil-api.base-url=http://127.0.0.1:1
integration.via-cep.base-url=http://127.0.0.1:1
integration.brapi.base-url=http://127.0.0.1:1
integration.brapi.token=brapi-ficticio
integration.alpha-vantage.base-url=http://127.0.0.1:1
integration.alpha-vantage.api-key=alphavantage-ficticia
integration.cvm.cadastro-zip-url=http://127.0.0.1:1/cad_intermed.zip
spring.test.mockmvc.print=none
