spring.application.name=sistemabancario

# Perfil padrão: PostgreSQL. Alternativas: dev (H2 arquivo), mysql
spring.profiles.active=postgresql

# JPA comum a todos os perfis de banco
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.cache.type=caffeine
spring.cache.cache-names=cnpj,cep,cotacao
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=15m

integration.brasil-api.base-url=https://brasilapi.com.br/api
integration.via-cep.base-url=https://viacep.com.br
integration.brapi.base-url=https://brapi.dev/api
# Obrigatório para cotar ações além de PETR4, VALE3, MGLU3 e ITUB4 (regra da BRAPI). Obtenha em https://brapi.dev/dashboard
# BRAPI_TOKEN (comum) ou INTEGRATION_BRAPI_TOKEN (convenção Spring Boot para integration.brapi.token)
integration.brapi.token=${BRAPI_TOKEN:${INTEGRATION_BRAPI_TOKEN:}}
integration.alpha-vantage.base-url=https://www.alphavantage.co
# Obrigatório para cotar ações americanas. Cadastro gratuito: https://www.alphavantage.co/support/#api-key
# Para teste limitado, defina explicitamente ALPHAVANTAGE_API_KEY=demo no ambiente ou integration.alpha-vantage.api-key=demo aqui.
integration.alpha-vantage.api-key=${ALPHAVANTAGE_API_KEY:}

integration.cvm.cadastro-zip-url=https://dados.cvm.gov.br/dados/INTERMED/CAD/DADOS/cad_intermed.zip

# JWT (HS256). Em produção defina APP_SECURITY_JWT_SECRET com pelo menos 32 bytes aleatórios.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:chave-local-dev-apenas-nao-usar-em-producao-256bits-minimo!!}
app.security.jwt.expiration-ms=${APP_SECURITY_JWT_EXPIRATION_MS:86400000}
