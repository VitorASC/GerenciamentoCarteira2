openapi: 3.0.3
info:
  title: Segurança da API GestãoAtiva
  version: "1.0"
  description: Contrato de autenticação e autorização das Aulas 13 e 14.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Autenticar e emitir um access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          description: E-mail ou senha inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /usuarios:
    post:
      summary: Cadastrar uma conta PADRAO
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cadastro'
      responses:
        '201':
          description: Conta criada com perfil PADRAO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '409':
          description: CPF ou e-mail já cadastrado
    get:
      summary: Listar usuários como ADMIN
      responses:
        '200':
          description: Página de usuários
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
  /usuarios/{id}/perfil-acesso:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Alterar o perfil de acesso de outro usuário como ADMIN
      description: A aplicação exige que permaneça pelo menos um administrador ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perfilAcesso]
              properties:
                perfilAcesso:
                  $ref: '#/components/schemas/PerfilAcesso'
      responses:
        '200':
          description: Conta com perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /carteiras:
    get:
      summary: Consultar carteiras acessíveis à conta autenticada
      responses:
        '200':
          description: Página de carteiras
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /acoes:
    get:
      summary: Consultar ações
      responses:
        '200':
          description: Página de ações
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      summary: Cadastrar ação como ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker, mercado]
              properties:
                ticker:
                  type: string
                  example: PETR4
                mercado:
                  type: string
                  enum: [BRASIL, ESTADOS_UNIDOS]
                corretoraId:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Ação cadastrada
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Ticker já cadastrado
        '502':
          $ref: '#/components/responses/Integracao'
  /acoes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Excluir ação como ADMIN
      responses:
        '204':
          description: Ação excluída
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /acoes/{id}/atualizar-cotacao:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Atualizar cotação como ADMIN
      responses:
        '200':
          description: Cotação atualizada
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '502':
          $ref: '#/components/responses/Integracao'
  /corretoras:
    get:
      summary: Consultar corretoras
      responses:
        '200':
          description: Página de corretoras
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      summary: Cadastrar corretora como ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cnpj, cep]
              properties:
                cnpj:
                  type: string
                cep:
                  type: string
                numero:
                  type: string
                complemento:
                  type: string
      responses:
        '201':
          description: Corretora cadastrada
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: CNPJ já cadastrado
        '502':
          $ref: '#/components/responses/Integracao'
  /corretoras/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Excluir corretora como ADMIN
      responses:
        '204':
          description: Corretora excluída
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    NaoAutenticado:
      description: Token Bearer ausente, inválido ou expirado, ou conta inativa
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    AcessoNegado:
      description: A conta autenticada não tem permissão para a operação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    DadosInvalidos:
      description: Validação ou regra de negócio impediu a operação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso não encontrado
    Integracao:
      description: Falha em integração externa
  schemas:
    PerfilAcesso:
      type: string
      enum: [PADRAO, ADMIN]
    PerfilInvestidor:
      type: string
      enum: [CONSERVADOR, MODERADO, ARROJADO]
    Login:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          writeOnly: true
    Token:
      type: object
      required: [tokenType, accessToken, expiresInMs, perfilAcesso]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
        expiresInMs:
          type: integer
          format: int64
          example: 86400000
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
    Cadastro:
      type: object
      required: [nomeCompleto, cpf, email, senha, perfilInvestidor]
      properties:
        nomeCompleto:
          type: string
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 6
          writeOnly: true
        dataNascimento:
          type: string
          format: date
        perfilInvestidor:
          $ref: '#/components/schemas/PerfilInvestidor'
    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nomeCompleto:
          type: string
        cpf:
          type: string
        email:
          type: string
          format: email
        dataNascimento:
          type: string
          format: date
          nullable: true
        perfilInvestidor:
          $ref: '#/components/schemas/PerfilInvestidor'
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
        dataCriacao:
          type: string
          example: "2026-10-01T10:00:00"
        ativo:
          type: boolean
    Erro:
      type: object
      properties:
        status:
          type: integer
        erro:
          type: string
        mensagem:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
